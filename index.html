<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CamX — What did we learn from 20K hours of open-source robot data?</title>
<meta name="description" content="CamX: the cross-embodiment robot manipulation dataset and the CamUVA policy rollouts (anonymous submission).">
<link rel="stylesheet" href="site.css">
<!-- The two sites. Old deep links into the page this used to be still land where they pointed: #rollouts and
     #rollouts-<setting>-<task> on the rollouts site, every other section hash (#browse, #download, #browser) on the
     dataset page. -->
<script>
(function(){const h=location.hash.slice(1);if(!h)return;
  const m=h.match(/^rollouts(?:-(.+))?$/);
  location.replace(m?'camuva-rollouts/'+(m[1]?'#'+m[1]:''):'camx-dataset/#'+h)})();
</script>
<style>
/* the question and two doors, nothing else: they sit in the middle of the window, the buttons side by side, stacked on a phone */
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:var(--pad-x)}
.home{display:flex;flex-direction:column;align-items:center;gap:40px;width:100%;max-width:820px}
.home h1{margin:0;font-size:clamp(28px,4.2vw,48px);line-height:1.1;letter-spacing:-.03em;font-weight:500;text-align:center;text-wrap:balance}
.doors{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;width:100%;max-width:760px}
.doors .button{flex:1 1 300px;justify-content:center;font-size:22px;padding:26px 32px;gap:14px;border-radius:12px;box-shadow:var(--shadow-md)}
.doors .button svg{width:28px;height:28px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:640px){.home{gap:28px}.doors{gap:14px}.doors .button{font-size:18px;padding:20px 22px;gap:10px}.doors .button svg{width:22px;height:22px}}
</style>
</head>
<body>
<main class="home">
<h1>What did we learn from 20K hours of open-source robot data?</h1>
<nav class="doors" aria-label="Sites">
  <a class="button primary" href="camx-dataset/"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6.5c0 1.7 3.6 3 8 3s8-1.3 8-3V5.5M4 12v6.5c0 1.7 3.6 3 8 3s8-1.3 8-3V12"/></svg>CamX Dataset</a>
  <a class="button primary" href="camuva-rollouts/"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="3.5" r="1.5"/><path d="M12 5v3"/><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M1.5 13v3M22.5 13v3M9 13v2M15 13v2"/></svg>CamUVA Rollouts</a>
</nav>
</main>
</body>
</html>
