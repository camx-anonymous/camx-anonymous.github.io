<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CamX — What did we learn from 20K hours of open-source robot data?</title>
<meta name="description" content="CamX: the cross-embodiment robot manipulation dataset and the CamUVA policy rollouts (anonymous submission).">
<link rel="stylesheet" href="site.css">
<!-- The two sites. Old deep links into the page this used to be still land where they pointed: #rollouts and
     #rollouts-<setting>-<task> on the rollouts site, every other section hash (#browse, #download, #browser) on the
     dataset page. -->
<script>
(function(){const h=location.hash.slice(1);if(!h)return;
  const m=h.match(/^rollouts(?:-(.+))?$/);
  location.replace(m?'camuva-rollouts/'+(m[1]?'#'+m[1]:''):'camx-dataset/#'+h)})();
</script>
<style>
/* the question and two doors; under each door the paper figure it leads to (dataset: composition; rollouts: the
   nine evaluation tasks). The columns sit side by side and stack on a phone. */
body{padding:clamp(36px,7vh,88px) var(--pad-x) 64px}
.home{display:flex;flex-direction:column;align-items:center;gap:44px;width:100%;max-width:var(--w-wide);margin:0 auto}
.home h1{margin:0;font-size:clamp(28px,4.2vw,48px);line-height:1.1;letter-spacing:-.03em;font-weight:500;text-align:center;text-wrap:balance}
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px;width:100%}
.door{display:flex;flex-direction:column;gap:28px;min-width:0;color:inherit;text-decoration:none}
.door .button{font-size:22px;padding:26px 32px;gap:14px;border-radius:12px;box-shadow:var(--shadow-md);transition:border-color .15s,color .15s,background .15s,transform .2s ease,box-shadow .2s ease}
.door .button svg{width:28px;height:28px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.door:hover .button.primary{background:var(--accent);border-color:var(--accent);color:#fff;transform:translateY(-2px);box-shadow:0 14px 32px -10px rgba(20,15,5,.28),0 3px 8px -2px rgba(20,15,5,.08)}
/* hover hint on the whole card: the figure grows a touch and gets an orange outline, so the image reads as part of the link, not just the button */
.door img{transition:transform .25s ease,box-shadow .25s ease,outline-color .25s ease;border-radius:var(--r);outline:2px solid transparent;outline-offset:6px}
.door:hover img{transform:scale(1.02);box-shadow:var(--shadow-md);outline-color:var(--accent)}
.door:active img{transform:scale(1.01)}
@media (prefers-reduced-motion:reduce){.door .button,.door img{transition:none}.door:hover .button.primary,.door:hover img{transform:none}}
/* the two figures share a horizontal centre line: the doors are equal height (grid stretch), the figure takes the
   room under the button and centres its image in it */
.door figure{margin:0;display:flex;flex-direction:column;justify-content:center;gap:28px;flex:1}
.door img{display:block;width:100%;height:auto}
:root[data-theme="dark"] .door img{background:#fff;border-radius:var(--r);padding:12px;box-sizing:border-box}
@media (max-width:760px){.doors{grid-template-columns:1fr;gap:36px}}
@media (max-width:640px){body{padding-bottom:40px}.home{gap:28px}.door{gap:18px}.door figure{gap:18px}.door .button{font-size:18px;padding:20px 22px;gap:10px}.door .button svg{width:22px;height:22px}}
</style>
</head>
<body>
<main class="home">
<h1>What did we learn from 20K hours of open-source robot data?</h1>
<nav class="doors" aria-label="Sites">
  <a class="door" href="camx-dataset/">
    <span class="button primary"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6.5c0 1.7 3.6 3 8 3s8-1.3 8-3V5.5M4 12v6.5c0 1.7 3.6 3 8 3s8-1.3 8-3V12"/></svg>Click to Browse CamX Dataset</span>
    <figure>
      <img src="figures/camx-composition.webp" width="1700" height="625" alt="Projection-based camera-pose validation on AgiBot, DROID, HoMMI and ABC frames, and the CamX composition: 20K hours, 1.7M episodes, 1.95B frames across handheld, single-arm, bimanual and mobile-base platforms">
    </figure>
  </a>
  <a class="door" href="camuva-rollouts/">
    <span class="button primary"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="3.5" r="1.5"/><path d="M12 5v3"/><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M1.5 13v3M22.5 13v3M9 13v2M15 13v2"/></svg>Click to Watch CamUVA Rollouts</span>
    <figure>
      <img src="figures/camuva-tasks.webp" width="1700" height="860" alt="The nine CamUVA evaluation tasks with their embodiment and its share of CamX: RoboLab, cup arrangement, towel folding, dish in rack and box placement; water pouring, cup flipping, cup in box and banana in pot">
    </figure>
  </a>
</nav>
</main>
</body>
</html>
